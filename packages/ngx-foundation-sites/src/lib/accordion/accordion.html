<!--
  Wait for initialization to ensure headerDef is populated.
  During ngAfterContentInit, we instantiate all item templates to trigger
  directive registration (header/content). Without this guard, the trigger
  button would render before headerDef is available.
-->
@if (initialized()) {
<ul
  ngAccordionGroup
  class="accordion"
  role="presentation"
  [multiExpandable]="multiExpand()"
  [disabled]="disabled()"
  [softDisabled]="softDisabled()"
  [wrap]="wrap()"
>
  @for (item of itemDefs(); track item.panelId()) {
  <li class="accordion-item" [class.is-active]="item.expanded()">
    <!--
      Optional heading wrapper for ARIA document outline navigation.
      When titleHeadingLevel is set (1-6), wraps trigger in role="heading" with aria-level.
      Per FR-031: .accordion-title must stay on the <button> element.
    -->
    @if (titleHeadingLevel(); as level) {
    <div role="heading" [attr.aria-level]="level">
      <button
        ngAccordionTrigger
        type="button"
        class="accordion-title"
        [panelId]="item.panelId()"
        [disabled]="item.disabled()"
        [(expanded)]="item.expanded"
      >
        <!-- Render header template -->
        @if (item.headerDef(); as headerDef) {
        <ng-container [ngTemplateOutlet]="headerDef.templateRef" />
        }
      </button>
    </div>
    } @else {
    <button
      ngAccordionTrigger
      type="button"
      class="accordion-title"
      [panelId]="item.panelId()"
      [disabled]="item.disabled()"
      [(expanded)]="item.expanded"
    >
      <!-- Render header template -->
      @if (item.headerDef(); as headerDef) {
      <ng-container [ngTemplateOutlet]="headerDef.templateRef" />
      }
    </button>
    }
    <div
      ngAccordionPanel
      class="accordion-content"
      [panelId]="item.panelId()"
      [id]="item.panelId()"
      [attr.inert]="!item.expanded() ? '' : null"
    >
      <!-- No [preserveContent] binding - defaults to false -->
      <ng-template ngAccordionContent>
        <div
          class="accordion-content-inner"
          animate.enter="nfs-accordion-enter"
          animate.leave="nfs-accordion-leave"
        >
          <ng-container
            [ngTemplateOutlet]="item.templateRef"
            [ngTemplateOutletInjector]="getItemInjector(item)"
          />
        </div>
      </ng-template>
    </div>
  </li>
  }
</ul>
}

<!-- Live region for screen reader announcements when announce is enabled -->
@if (announce()) {
<div role="status" aria-live="polite" aria-atomic="true" class="sr-only">
  {{ announcement() }}
</div>
}
