<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Fixture only: records dialog events from the first byte, before any Angular code runs.
    window.__log = [];
    for (const type of ['close', 'toggle', 'beforetoggle', 'cancel']) {
      document.addEventListener(type, (e) => window.__log.push('event:' + type + ':' + (e.target.id || e.target.tagName)), true);
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
