<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Autofocus probe</title>
</head>
<body>
  <!-- A static autoFocus="first-heading" on a Reveal host is HTML's autofocus attribute. Here the
       dialog is parsed open, as a server-rendered non-modal Reveal would be. -->
  <p><button id="page-btn">Page</button></p>
  <dialog open id="e" autofocus="first-heading" aria-label="E">
    <h2 id="e-title">Title</h2>
    <button id="e-btn">E</button>
  </dialog>
</body>
</html>
